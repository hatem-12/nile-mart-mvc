
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Category | NileMart</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #263238;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
        }

        .form-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
        }

        h1 {
            color: #172b4d;
            margin: 0 0 8px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #344563;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce2ea;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #3155a4;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .checkbox-group label {
            margin: 0;
        }

        .error {
            display: block;
            color: #d93025;
            font-size: 13px;
            margin-top: 6px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .cancel-btn {
            padding: 12px 20px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        button {
            background: #3155a4;
            color: white;
            flex: 1;
        }

        button:hover {
            background: #243f80;
        }

        .cancel-btn {
            background: #edf0f4;
            color: #344563;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="form-card">

        <h1>Add Category</h1>
        <p class="subtitle">Create a new store category</p>

        <form action="/categories"
              method="post"
              th:object="${categories}">

            <div class="form-group">
                <label for="name">Category Name</label>

                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter category name">

                <span class="error"
                      th:errors="*{name}">
                </span>
            </div>

            <div class="form-group">
                <label for="slug">Slug</label>

                <input type="text"
                       id="slug"
                       th:field="*{slug}"
                       placeholder="example-category">

                <span class="error"
                      th:errors="*{slug}">
                </span>
            </div>

            <div class="form-group">
                <label for="parentSlug">Parent Category</label>

                <select id="parentSlug" th:field="*{parentSlug}">

                    <option value="">None (Top-Level Category)</option>

                    <option th:each="parent : ${parentCategories}"
                            th:value="${parent.slug}"
                            th:text="${parent.name}">
                    </option>

                </select>

                <span class="error"
                      th:errors="*{parentSlug}">
                </span>
            </div>

            <div class="form-group">
                <label for="displayOrder">Display Order</label>

                <input type="number"
                       id="displayOrder"
                       th:field="*{displayOrder}"
                       placeholder="Enter display order">

                <span class="error"
                      th:errors="*{displayOrder}">
                </span>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox"
                       id="active"
                       th:field="*{active}">

                <label for="active">Active</label>
            </div>

            <div class="buttons">
                <button type="submit">Save Category</button>

                <a href="/categories" class="cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

</body>
</html>
