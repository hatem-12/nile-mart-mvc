
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 35px;
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
            color: #374151;
        }

        tr:hover {
            background: #f9fafb;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>Products</h1>
        <a class="add-btn" th:href="@{/products/new}">+ Add Product</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>SKU</th>
            <th>Product Name</th>
            <th>Category</th>
            <th>Brand</th>
            <th>Price</th>
            <th>Stock</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="product : ${availableProducts}">
            <td th:text="${product.sku}"></td>

            <td th:text="${product.name}"></td>

            <td th:text="${categoryNames[product.category]}"></td>

            <td>
                <span th:if="${product.brandSlug == null
                              or #strings.isEmpty(product.brandSlug)}">
                    No Brand
                </span>

                <span th:unless="${product.brandSlug == null
                                  or #strings.isEmpty(product.brandSlug)}"
                      th:text="${brandNames[product.brandSlug]}">
                </span>
            </td>

            <td th:text="${product.price + ' EGP'}"></td>

            <td th:text="${product.inStock}"></td>
        </tr>

        <tr th:if="${#lists.isEmpty(availableProducts)}">
            <td colspan="6" class="empty">
                No products available.
            </td>
        </tr>

        </tbody>
    </table>

</div>

</body>
</html>
