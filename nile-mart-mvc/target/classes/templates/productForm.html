<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .error {
            display: block;
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Add New Product</h1>

    <form th:action="@{/products}"
          th:object="${product}"
          method="post">

        <div class="form-group">
            <label>SKU</label>
            <label>
                <input type="text" th:field="*{sku}" placeholder="Enter product SKU">
            </label>
            <span class="error"
                  th:if="${#fields.hasErrors('sku')}"
                  th:errors="*{sku}"></span>
        </div>

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" th:field="*{name}" placeholder="Enter product name">
            <span class="error"
                  th:if="${#fields.hasErrors('name')}"
                  th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select th:field="*{category}">
                <option value="">Choose a subcategory</option>

                <option th:each="category : ${categories}"
                        th:value="${category.slug}"
                        th:text="${category.name}">
                </option>
            </select>

            <span class="error"
                  th:if="${#fields.hasErrors('category')}"
                  th:errors="*{category}"></span>
        </div>

        <div class="form-group">
            <label>Brand</label>
            <select th:field="*{brandSlug}">
                <option value="">No brand</option>

                <option th:each="brand : ${brands}"
                        th:value="${brand.slug}"
                        th:text="${brand.name}">
                </option>
            </select>

            <span class="error"
                  th:if="${#fields.hasErrors('brandSlug')}"
                  th:errors="*{brandSlug}">
</span>
        </div>

        <div class="form-group">
            <label>Price (EGP)</label>
            <input type="number" step="0.01"
                   th:field="*{price}"
                   placeholder="Enter price">

            <span class="error"
                  th:if="${#fields.hasErrors('price')}"
                  th:errors="*{price}"></span>
        </div>

        <div class="form-group">
            <label>Stock</label>
            <label>
                <input type="number"
                       th:field="*{inStock}"
                       placeholder="Enter stock quantity">
            </label>

            <span class="error"
                  th:if="${#fields.hasErrors('inStock')}"
                  th:errors="*{inStock}"></span>
        </div>

        <button type="submit">Save Product</button>

    </form>

    <a class="back" th:href="@{/products}">Back to Products</a>

</div>

</body>
</html>
